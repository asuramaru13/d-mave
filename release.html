    .rp-services {

    .svc {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 13px 18px; border-radius: 16px; text-decoration: none; color: var(--ink);

    .svc:hover {

      background: rgba(255, 255, 255, .26);

  <script>
    // Apple-style появление при загрузке (каскадом). setTimeout, а не rAF — надёжнее.
    (function () {
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var els = [].slice.call(document.querySelectorAll('.reveal'));
      if (reduced) { els.forEach(function (el) { el.classList.add('in'); }); return; }
      setTimeout(function () {
        els.forEach(function (el, i) {
          el.style.transitionDelay = (i * 0.07) + 's';
          el.classList.add('in');
        });
      }, 80);
    })();
